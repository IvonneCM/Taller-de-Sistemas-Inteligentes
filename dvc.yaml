stages:
  procesar_clima:
    cmd: python scripts/procesar_clima.py
    deps:
      - scripts/procesar_clima.py
      - data/raw/clima/senamhi/senamhi_raw_SE01_13_2026.csv
    outs:
      - data/processed/control_calidad_clima.csv:
          cache: false
      - data/processed/clima_diario.csv:
          cache: false
      - data/processed/clima_semanal.csv:
          cache: false

  limpieza_datos:
    cmd: python scripts/limpieza_datos.py
    deps:
      - scripts/limpieza_datos.py
      - data/processed/clima_diario.csv
      - data/raw/epidemiologia
    outs:
      - data/processed/clima_diario_imputado.csv:
          cache: false
      - data/processed/clima_semanal_calidad.csv:
          cache: false
      - data/processed/dengue_municipal_validado.csv:
          cache: false
      - data/processed/malaria_municipal_validado.csv:
          cache: false
      - data/processed/dengue_semanal_validado.csv:
          cache: false
      - data/processed/resumen_calidad_pipeline.md:
          cache: false
      - data/processed/resumen_calidad_pipeline.json:
          cache: false

  ventanas_temporales_clima:
    cmd: python scripts/ventanas_temporales_clima.py
    deps:
      - scripts/ventanas_temporales_clima.py
      - data/processed/clima_semanal_calidad.csv
    outs:
      - data/processed/clima_semanal_ventanas.csv:
          cache: false

  integrar_datos:
    cmd: python scripts/integrar_datos.py
    deps:
      - scripts/integrar_datos.py
      - data/processed/clima_semanal.csv
      - data/raw/epidemiologia
    outs:
      - data/processed/dataset_integrado_municipal.csv:
          cache: false

  extraer_dengue_semanal:
    cmd: python scripts/extraer_dengue_semanal.py
    deps:
      - scripts/extraer_dengue_semanal.py
      - data/boletines/SE13.pdf
      - data/processed/dengue_municipal_validado.csv
    outs:
      - data/processed/dengue_municipal_semanal.csv:
          cache: false

  clima_nasa_power:
    cmd: python scripts/clima_nasa_power.py
    deps:
      - scripts/clima_nasa_power.py
      - data/reference/municipios_coordenadas.csv
    outs:
      # persist: DVC no debe borrar el crudo antes de correr la etapa; si no,
      # cada repro volveria a descargarlo de NASA y el resultado podria cambiar.
      - data/raw/clima/nasa_power/nasa_power_diario.csv:
          cache: false
          persist: true
      - data/processed/clima_nasa_power_semanal.csv:
          cache: false

  extraer_malaria_boletines:
    cmd: python scripts/extraer_malaria_boletines.py
    deps:
      - scripts/extraer_malaria_boletines.py
      - data/boletines
      - data/raw/epidemiologia/malaria_bolivia_municipal_SE01_13_2026.csv
    outs:
      - data/processed/malaria_acumulado_por_boletin.csv:
          cache: false
      - data/processed/malaria_municipal_bloques.csv:
          cache: false

  extraer_dengue_revisiones:
    cmd: python scripts/extraer_dengue_revisiones.py
    deps:
      - scripts/extraer_dengue_revisiones.py
      - data/boletines
      - data/processed/dengue_municipal_semanal.csv
    outs:
      - data/processed/dengue_revisiones_boletines.csv:
          cache: false
      - data/processed/dengue_revisiones_resumen.csv:
          cache: false

  construir_panel_semanal:
    cmd: python scripts/construir_panel_semanal.py
    deps:
      - scripts/construir_panel_semanal.py
      - data/processed/clima_nasa_power_semanal.csv
      - data/processed/clima_semanal.csv
      - data/processed/dengue_municipal_semanal.csv
    outs:
      - data/processed/panel_semanal_dengue_clima.csv:
          cache: false

  construir_panel_malaria:
    cmd: python scripts/construir_panel_malaria.py
    deps:
      - scripts/construir_panel_malaria.py
      - data/processed/malaria_municipal_bloques.csv
      - data/processed/clima_nasa_power_semanal.csv
    outs:
      - data/processed/panel_bloques_malaria_clima.csv:
          cache: false

  eda_integrado:
    cmd: python scripts/eda_integrado.py
    deps:
      - scripts/eda_integrado.py
      - data/processed/dataset_integrado_municipal.csv