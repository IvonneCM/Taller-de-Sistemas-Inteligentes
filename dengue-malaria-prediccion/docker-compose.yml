# Entorno local: PostgreSQL 16 + PostGIS, la API y el job de ML.
# Credenciales desde .env (copiar de .env.example); no hay secretos aqui.
#   docker compose up -d db                       -> solo la base de datos (TASK-002)
#   docker compose up --build api                 -> base de datos + API
#   docker compose up --build api web             -> ... + frontend en http://localhost:8080
#   docker compose run --rm ml python -m <modulo> -> ETL / prediccion (imagen ml)
x-app-env: &app-env
  # Variables de config.py, tomadas de .env. Explicitas (sin env_file) para que
  # tambien lleguen con `docker compose run` y no se filtre POSTGRES_PASSWORD.
  environment:
    # Dentro de la red de compose la BD es "db:5432", no localhost.
    DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY en .env}
    ALGORITHM: ${ALGORITHM:-HS256}
    ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
    REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
    ENVIRONMENT: ${ENVIRONMENT:-development}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB en .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    <<: *app-env
    build:
      context: .
      target: api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Esqueleto del frontend (Fase 5): nginx sirve el build y reenvia /api/ a "api".
  web:
    build: ./frontend
    depends_on:
      - api
    ports:
      - "8080:80"

  # Job de ETL/prediccion: no arranca con `docker compose up` (profile "jobs").
  ml:
    <<: *app-env
    profiles: ["jobs"]
    build:
      context: .
      target: ml
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-c", "import pandas, sklearn, xgboost, shap; print('imagen ml lista')"]

volumes:
  pgdata:
