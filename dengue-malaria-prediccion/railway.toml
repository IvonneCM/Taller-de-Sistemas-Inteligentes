# Configuracion de Railway para el servicio de la API (TASK-004).
# El Dockerfile construye su ULTIMA etapa (target "api").
# OJO: Railway no sigue el Root Directory para este archivo; en el servicio hay
# que poner "Config File Path" = /dengue-malaria-prediccion/railway.toml
# (ver docs/guia_despliegue_railway.md).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Aplica las migraciones antes de cambiar a la version nueva; si falla, el
# despliegue no avanza y se conserva la version anterior.
preDeployCommand = ["alembic upgrade head"]
healthcheckPath = "/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
