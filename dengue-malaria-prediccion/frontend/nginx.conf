# Cabeceras de seguridad (TASK-035, H-4/H-9). El navegador solo carga recursos de
# este origen, salvo las teselas del mapa de OpenStreetMap (unica dependencia
# externa, ver src/components/MapaZonas.jsx).
# HSTS solo se envia cuando el proxy de delante ya terminó TLS (X-Forwarded-Proto);
# por HTTP plano (Docker local) un navegador lo ignoraria.
map $http_x_forwarded_proto $hsts {
  default "";
  https   "max-age=31536000; includeSubDomains";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
  add_header Strict-Transport-Security $hsts always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

  # /api/* -> servicio "api" del compose (sin CORS en el navegador).
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    # Las cabeceras de seguridad las pone nginx; se descartan las del upstream
    # para no duplicarlas.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header Content-Security-Policy;
  }

  location / {
    try_files $uri /index.html;
  }
}
