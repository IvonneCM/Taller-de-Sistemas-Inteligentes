# Prediccion semanal (TASK-016). Diseno de Ignacio en docs/guia_despliegue_render_neon.md §6;
# el modulo que ejecuta es app/ml/job_semanal.py. Corre contra la base de Neon.
#
# Requiere los secretos del repositorio DATABASE_URL (la URL de Neon) y SECRET_KEY
# (de 32 o mas caracteres), en Settings > Secrets and variables > Actions.
# Sin ellos el job falla en el primer paso y avisa; no hace nada a medias.
name: Prediccion semanal

on:
  schedule:
    - cron: "17 6 * * 1"   # lunes 06:17 UTC = 02:17 en Bolivia (UTC-4); el minuto 17 evita la hora en punto
  workflow_dispatch:        # ejecucion manual (tambien sirve para verificar la TASK-016)
    inputs:
      forzar:
        description: "Agregar la tanda aunque ya haya una esta semana"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: prediccion-semanal
  cancel-in-progress: false

jobs:
  predecir:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: dengue-malaria-prediccion
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      ENVIRONMENT: production
    steps:
      - name: Comprobar que estan los secretos
        run: |
          [ -n "$DATABASE_URL" ] && [ -n "$SECRET_KEY" ] || { echo "::error::Faltan los secretos DATABASE_URL y SECRET_KEY del repositorio."; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dengue-malaria-prediccion/requirements-ml.txt
      - run: pip install -r requirements-ml.txt
      - name: Generar predicciones y evaluar alertas
        run: python -m app.ml.job_semanal ${{ inputs.forzar && '--forzar' || '' }}
